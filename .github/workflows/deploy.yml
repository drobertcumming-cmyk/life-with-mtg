name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages on every push to the
# default branch. First-time setup: repo Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main, implement-mtg-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        # astro.config.mjs derives base path from GITHUB_REPOSITORY automatically.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # First-ever Pages provisioning can exceed the 10-min default and abort.
          # Give it room so the deploy doesn't time out before the site goes live.
          timeout: 1800000
          error_count: 20
